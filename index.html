<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کتاب اوراهان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Vazirmatn:wght@200;300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-main: 'Vazirmatn', sans-serif;
            --font-title: 'Amiri', serif;
            --font-size: 18px;
            --bg-main-from: #0a0a0a; 
            --bg-main-to: #000000;
            --bg-glass: rgba(15, 23, 42, 0.75); 
            --bg-glass-border: rgba(212, 175, 55, 0.3);
            --text-main: #d1d5db; 
            --text-title: #ffffff;
            --color-gold: #d4af37; 
            --color-gold-transparent: rgba(212, 175, 55, 0.1);
            --color-gold-shadow: rgba(212, 175, 55, 0.3); 
            --scrollbar-track: #1a1a1a; 
            --scrollbar-thumb: #d4af37;
            --fog-color: rgba(255, 255, 255, 0.03);
        }

        .h-dynamic { height: 100vh; height: 100dvh; }

        @keyframes background-pan {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: var(--font-main);
            background-image: linear-gradient(to bottom left, var(--bg-main-from), var(--bg-main-to), var(--bg-main-from));
            background-size: 200% 200%;
            color: var(--text-main);
            animation: background-pan 30s ease infinite;
        }

        #content-display-wrapper::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none;
            background-image: radial-gradient(circle at 20% 30%, var(--fog-color) 0%, transparent 40%), radial-gradient(circle at 80% 70%, var(--fog-color) 0%, transparent 40%);
            background-size: 300% 300%;
            animation: moveFog 45s linear infinite alternate;
        }
        @keyframes moveFog { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }

        h1, h2, h3, h4, h5, h6, blockquote { font-family: var(--font-title); color: var(--text-title); }

        #content-display .text-red-600, 
        #content-display .text-red-500,
        .neon-red {
            color: #ff4d4d !important;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6) !important;
            font-weight: 900;
            letter-spacing: 1px;
            display: inline-block;
            animation: blood-pulse 2.5s ease-in-out infinite alternate !important;
        }

        @keyframes blood-pulse {
            0% { text-shadow: 0 0 5px rgba(255, 0, 0, 0.4); opacity: 0.9; transform: scale(1); }
            100% { text-shadow: 0 0 15px rgba(255, 0, 0, 0.9), 0 0 25px rgba(220, 0, 0, 0.6); opacity: 1; transform: scale(1.02); }
        }

        .sidebar {
            background-color: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-left-width: 1px; border-left-color: var(--bg-glass-border);
            transition: transform 0.3s ease-in-out;
            position: fixed; top: 0; right: 0; height: 100%; z-index: 50;
            transform: translateX(100%); width: 85%; max-width: 320px;
        }
        @media (min-width: 768px) { .sidebar { position: relative; transform: translateX(0); width: 25%; max-width: none; } }
        .sidebar.open { transform: translateX(0); }

        /* استایل‌های مربوط به آرک‌بندی منو */
        .arc-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }
        .arc-content.open {
            max-height: 1000px; /* فضای کافی برای باز شدن منو */
            transition: max-height 0.6s ease-in;
        }
        .arc-icon { transition: transform 0.3s ease; }
        .arc-icon.open { transform: rotate(180deg); }

        .chapter-link {
            transition: background-color 0.3s, color 0.3s, transform 0.2s ease-out;
            border-right: 4px solid transparent; text-align: right; width: 100%; display: block;
        }
        .chapter-link:hover { background-color: var(--color-gold-transparent); transform: translateX(-5px); }
        .chapter-link.active {
            background-color: var(--color-gold); color: var(--bg-main-from); font-weight: bold;
            box-shadow: 0 0 15px var(--color-gold-shadow);
        }

        .content-area { transition: opacity 0.3s ease-out; line-height: 2.2; font-size: var(--font-size); padding-bottom: 120px; position: relative; z-index: 10;}
        .content-area.fading-out { opacity: 0; }
        
        #progress-bar {
            position: absolute; top: 0; left: 0; height: 4px; background-color: var(--color-gold);
            width: 0%; transition: width 0.2s ease-out; z-index: 100;
        }

        .text-ura-gold { color: var(--color-gold); text-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        
        blockquote, .dialogue-quote { 
            position: relative; margin: 2.5rem 0; padding: 1.5rem 3rem 1.5rem 1.5rem;
            border-right: 4px solid var(--color-gold); font-style: italic; 
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.05) 60%, rgba(212, 175, 55, 0.12));
            border-radius: 0.5rem 0 0 0.5rem; color: #e5e7eb; font-size: 1.05em; line-height: 2.2;
            box-shadow: inset -10px 0 20px -10px rgba(212, 175, 55, 0.2);
        }
        blockquote::before, .dialogue-quote::before {
            content: "«"; position: absolute; top: -15px; right: 15px; font-size: 5rem;
            color: var(--color-gold); opacity: 0.15; font-family: var(--font-title); line-height: 1; pointer-events: none;
        }
        
        .quote-raion { border-right-color: #ef4444; background: linear-gradient(90deg, transparent, rgba(239, 68, 68, 0.05) 60%, rgba(239, 68, 68, 0.12)); box-shadow: inset -10px 0 20px -10px rgba(239, 68, 68, 0.2); }
        .quote-raion::before { color: #ef4444; }
        .quote-elara { border-right-color: #fef08a; background: linear-gradient(90deg, transparent, rgba(254, 240, 138, 0.05) 60%, rgba(254, 240, 138, 0.15)); box-shadow: inset -10px 0 20px -10px rgba(254, 240, 138, 0.2); }
        .quote-elara::before { color: #fef08a; }
        .quote-weaver { border-right-color: #a855f7; background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.05) 60%, rgba(168, 85, 247, 0.12)); box-shadow: inset -10px 0 20px -10px rgba(168, 85, 247, 0.2); }
        .quote-weaver::before { color: #a855f7; }
        .quote-lucius { border-right-color: #3b82f6; background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.05) 60%, rgba(59, 130, 246, 0.12)); box-shadow: inset -10px 0 20px -10px rgba(59, 130, 246, 0.2); }
        .quote-lucius::before { color: #3b82f6; }
        .quote-kaira { border-right-color: #f97316; background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.05) 60%, rgba(249, 115, 22, 0.12)); box-shadow: inset -10px 0 20px -10px rgba(249, 115, 22, 0.2); }
        .quote-kaira::before { color: #f97316; }
        
        .loading-spinner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.1); border-top-color: var(--color-gold);
            border-radius: 50%; animation: spin 1s linear infinite; z-index: 100; opacity: 0; pointer-events: none;
        }
        .loading-spinner.visible { opacity: 1; pointer-events: auto; }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        #error-message { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100%; padding: 2rem; position: relative; z-index: 10; }
        #error-message.visible { display: flex !important; }
        
        .content-scroll::-webkit-scrollbar { width: 6px; }
        .content-scroll::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        .content-scroll::-webkit-scrollbar-thumb { background-color: var(--scrollbar-thumb); border-radius: 10px; }

        .fade-in-up { opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
        .fade-in-up.is-visible { opacity: 1; transform: translateY(0); }
        .fade-in-right { opacity: 0; transform: translateX(-30px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
        .fade-in-right.is-visible { opacity: 1; transform: translateX(0); }
        
        #nav-buttons { transition: transform 0.5s ease-out, opacity 0.5s ease-out; transform: translateY(100%); opacity: 0; pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 1rem); }
        #nav-buttons.is-visible { transform: translateY(0); opacity: 1; }
        
        .nav-button-new {
            background-color: var(--bg-glass); border: 1px solid var(--bg-glass-border); color: var(--text-main);
            border-radius: 9999px; width: 3.5rem; height: 3.5rem; display: flex; align-items: center; justify-content: center;
            pointer-events: auto; transition: all 0.3s ease; backdrop-filter: blur(10px);
        }
        .nav-button-new:hover { color: var(--color-gold); border-color: var(--color-gold); box-shadow: 0 0 10px var(--color-gold-shadow); transform: scale(1.05); }
        .nav-button-new:disabled { opacity: 0.3; pointer-events: none; }
        
        .menu-btn { background-color: var(--bg-glass); border: 1px solid var(--bg-glass-border); color: white; }
        .setting-box { background-color: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.5rem; padding: 0.75rem; margin-top: 1.5rem; }
    </style>
</head>
<body class="antialiased overflow-hidden h-dynamic">

    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden"></div>

    <div class="flex flex-col md:flex-row h-full">
        <aside id="sidebar" class="sidebar p-5 md:p-6 content-scroll flex flex-col">
            <h1 class="text-3xl font-bold text-center mb-4 tracking-wider text-ura-gold" style="font-family: var(--font-title);">کتاب اوراهان</h1>
            <p class="text-sm text-center mb-4 opacity-70 border-b border-gray-700 pb-4">نوشته‌ی Rai</p>
            
            <!-- کانتینر فهرست که توسط جاوااسکریپت پر می‌شود -->
            <nav id="toc" class="flex flex-col flex-1 pb-4"></nav>

            <div class="setting-box flex flex-col gap-4 mt-auto">
                <div class="flex items-center justify-between text-sm">
                    <span>اندازه متن: <span id="font-size-label">18</span></span>
                    <div class="flex gap-2">
                        <button id="decrease-font" class="menu-btn px-3 py-1 rounded outline-none hover:text-ura-gold transition">-</button>
                        <button id="increase-font" class="menu-btn px-3 py-1 rounded outline-none hover:text-ura-gold transition">+</button>
                    </div>
                </div>
                <div class="flex items-center justify-between text-sm">
                    <span>موسیقی متن</span>
                    <button id="toggle-audio" class="menu-btn px-4 py-1.5 rounded outline-none hover:text-ura-gold transition">بی‌صدا</button>
                </div>
            </div>
        </aside>

        <main id="content-display-wrapper" class="relative flex-1 h-full overflow-hidden bg-[rgba(0,0,0,0.3)]">
            <div id="progress-bar"></div>
            
            <button id="menu-toggle" class="md:hidden fixed top-3 right-3 p-2 rounded-lg menu-btn w-10 h-10 outline-none z-50">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            </button>
            
            <div id="loading-spinner" class="loading-spinner"></div>
            
            <div id="error-message">
                <h3 class="text-xl text-red-500 mb-4">خطا در دریافت اطلاعات از سرور</h3>
                <button id="retry-btn" class="menu-btn px-6 py-2 rounded-full mt-4 hover:text-ura-gold transition">تلاش مجدد</button>
            </div>
            
            <div id="content-display" class="w-full h-full overflow-y-auto p-5 sm:p-8 md:p-16 content-scroll content-area"></div>
            
            <div id="nav-buttons" class="absolute bottom-0 left-0 w-full flex justify-between p-4 sm:p-6 z-20">
                <button id="prev-chapter" class="nav-button-new outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <button id="next-chapter" class="nav-button-new outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </main>
    </div>

    <script>
        const musicTracks = {
            'calm': 'https://ia601703.us.archive.org/17/items/05-jeremy-soule-ancient-stones/05_jeremy_soule_-_ancient_stones.mp3',
            'epic': 'https://ia601701.us.archive.org/17/items/skyrim_-_far_horizons_4sxl/skyrim_-_far_horizons_4sxl.mp3',
            'epic2': 'https://ia600501.us.archive.org/18/items/21-the-vagabond/21%20The%20Vagabond.mp3',
            'epic3': 'https://ia601204.us.archive.org/7/items/elder_scrolls_5_-_skyrim_-_117_-_jeremy_soule_-_secunda/elder_scrolls_5_-_skyrim_-_117_-_jeremy_soule_-_secunda.mp3',
            'epic4': 'https://ia600501.us.archive.org/18/items/21-the-vagabond/21%20The%20Vagabond.mp3',
            'epic5': 'https://ia600501.us.archive.org/18/items/21-the-vagabond/21%20The%20Vagabond.mp3', 
            'epic6': 'https://ia600501.us.archive.org/18/items/21-the-vagabond/21%20The%20Vagabond.mp3'
        };

        // دیتای خام چپترها برای واکشی متن‌ها
        const storyData = {
            'prologue': {
                title: 'مقدمه: آموزشِ کوتاه',
                content: `
                <div class="fade-in-up" style="animation-delay: 0.1s;">
                    <h2 class="text-4xl md:text-6xl font-bold mb-8 tracking-wide text-ura-gold">به اوراهان خوش آمدید</h2>
                    <p class="leading-loose mb-6">این نسخه اختصاصی ترکیبی از سرعت بالا، سیستم موسیقی هوشمند و افکت‌های اتمسفریک است.</p>
                    <ul class="list-disc pr-6 space-y-4 leading-loose">
                        <li><strong>منوی کناری:</strong> چپترها به صورت آرک‌بندی شده قرار گرفته‌اند تا دسترسی آسان باشد.</li>
                        <li><strong>تنظیمات:</strong> در پایینِ منوی کناری می‌توانید سایز فونت را تغییر داده یا موسیقی را فعال کنید.</li>
                        <li><strong>جابجایی سریع:</strong> دکمه‌های پایین صفحه یا کلیدهای جهت‌نمای کیبورد به شما کمک می‌کنند فصل‌ها را ورق بزنید.</li>
                    </ul>
                    <h3 class="text-2xl mt-12 mb-6 font-bold text-ura-gold">آماده‌اید؟</h3>
                    <p class="leading-loose">از طریق دکمه پایین یا منوی کناری، وارد <strong>آرک اول</strong> شوید.</p>
                </div>
                `
            },
            'chapter1': { title: 'چپتر یک: زمزمه‌های پایانی', contentUrl: 'https://raw.githubusercontent.com/alpha1385m-arch/Story/refs/heads/main/chapter1.html' },
            'chapter2': { title: 'چپتر دوم: فراخوان تاریکی', contentUrl: 'https://raw.githubusercontent.com/alpha1385m-arch/Story/refs/heads/main/chapter2.html' },
            'chapter3': { title: 'چپتر سوم: ریشه‌های شکسته', contentUrl: 'https://raw.githubusercontent.com/alpha1385m-arch/Story/refs/heads/main/chapter3.html' },
            'chapter4': { title: 'چپتر چهارم: بایگانی خاموش', contentUrl: 'https://raw.githubusercontent.com/alpha1385m-arch/Story/refs/heads/main/chapter4.html' },
            'chapter5': { title: 'چپتر پنجم: پیمان‌های شکسته', contentUrl: 'https://raw.githubusercontent.com/alpha1385m-arch/Story/refs/heads/main/chapter5.html' },
            'chapter6': { title: 'چپتر ششم: نفرینِ گرانیتوس', contentUrl: 'https://raw.githubusercontent.com/alpha1385m-arch/Story/refs/heads/main/chapter6.html' },
            'chapter7': { title: 'چپتر هفتم: شهرِ دروغ‌گوها', contentUrl: 'https://raw.githubusercontent.com/alpha1385m-arch/Story/refs/heads/main/chapter7.html' },
            'chapter8': { title: 'چپتر هشتم: ضیافتِ ارواح', contentUrl: 'https://raw.githubusercontent.com/alpha1385m-arch/Story/refs/heads/main/chapter8.html' },
            'chapter9': { title: 'چپتر نهم: سایه‌هایِ فراموش‌شده', contentUrl: 'https://raw.githubusercontent.com/alpha1385m-arch/Story/refs/heads/main/chapter9.html' },
            'chapter10': { title: 'چپتر دهم: پژواکِ نیستی', contentUrl: 'https://raw.githubusercontent.com/alpha1385m-arch/Story/refs/heads/main/chapter10.html' }
        };

        // ساختار آرک‌بندی برای منوی کناری (Sidebar)
        const tocStructure = [
            { id: 'prologue', isArc: false },
            { 
                id: 'arc1', 
                title: 'آرک اول: دژ امید', 
                isArc: true, 
                chapters: ['chapter1', 'chapter2', 'chapter3', 'chapter4', 'chapter5', 'chapter6', 'chapter7', 'chapter8', 'chapter9', 'chapter10'] 
            }
            // آرک‌های بعدی را می‌توانید در آینده اینجا اضافه کنید
        ];

        // آرایه مسطح برای دکمه‌های ناوبری (بعدی/قبلی)
        const chapterKeys = Object.keys(storyData);
        let currentChapterId = 'prologue'; 
        let isAnimating = false;
        let contentObserver = null;
        let chapterCache = {};

        let fontSize = 18;
        let isMuted = true;

        const els = {
            toc: document.getElementById('toc'),
            contentDisplay: document.getElementById('content-display'),
            spinner: document.getElementById('loading-spinner'),
            errorMessage: document.getElementById('error-message'),
            retryBtn: document.getElementById('retry-btn'),
            navButtons: document.getElementById('nav-buttons'),
            progressBar: document.getElementById('progress-bar'),
            prevChapter: document.getElementById('prev-chapter'),
            nextChapter: document.getElementById('next-chapter'),
            menuToggle: document.getElementById('menu-toggle'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            incFont: document.getElementById('increase-font'),
            decFont: document.getElementById('decrease-font'),
            fontLabel: document.getElementById('font-size-label'),
            audioBtn: document.getElementById('toggle-audio')
        };

        const AudioManager = {
            player: new Audio(),
            init: function() { this.player.loop = true; },
            getTrackUrl: function(chapterId) {
                switch (chapterId) {
                    case 'prologue': return musicTracks['calm'];
                    case 'chapter2': case 'chapter7': return musicTracks['epic2'];
                    case 'chapter3': case 'chapter8': return musicTracks['epic3'];
                    case 'chapter4': case 'chapter9': return musicTracks['epic4'];
                    case 'chapter5': case 'chapter10': return musicTracks['epic5'];
                    case 'chapter6': return musicTracks['epic6'];
                    default: return musicTracks['epic']; 
                }
            },
            playForChapter: function(chapterId) {
                if (isMuted) { this.player.pause(); return; }
                const trackUrl = this.getTrackUrl(chapterId);
                if (this.player.src !== trackUrl) {
                    this.player.pause(); this.player.removeAttribute('src'); 
                    this.player.src = trackUrl; this.player.load();
                }
                const playPromise = this.player.play();
                if (playPromise !== undefined) playPromise.catch(e => console.warn(`Autoplay prevented: ${e.message}`));
            }
        };

        AudioManager.init();

        function applyFontSize() {
            document.documentElement.style.setProperty('--font-size', `${fontSize}px`);
            els.fontLabel.textContent = fontSize;
            try { localStorage.setItem('urahan_font_size', fontSize); } catch(e){}
        }

        try {
            const savedSize = localStorage.getItem('urahan_font_size');
            if (savedSize) { fontSize = parseInt(savedSize); applyFontSize(); }
        } catch(e){}

        function cleanHTMLContent(rawText) {
            let cleanText = rawText.trim();
            const firstTag = cleanText.indexOf('<');
            const lastTag = cleanText.lastIndexOf('>');
            if (firstTag !== -1 && lastTag !== -1) cleanText = cleanText.substring(firstTag, lastTag + 1);
            return cleanText;
        }

        async function fetchChapter(chapterId) {
            const chapter = storyData[chapterId];
            if (chapterCache[chapterId]) return chapterCache[chapterId];
            if (chapter.content) return chapter.content;
            
            const bypassCacheUrl = chapter.contentUrl + '?v=' + new Date().getTime();
            try {
                const response = await fetch(bypassCacheUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                if (!text || text.trim() === '') throw new Error("محتوای خالی");
                const cleanedContent = cleanHTMLContent(text);
                chapterCache[chapterId] = cleanedContent;
                return cleanedContent;
            } catch(e) { throw e; }
        }

        function preloadNextChapter() {
            const idx = chapterKeys.indexOf(currentChapterId);
            if (idx >= 0 && idx < chapterKeys.length - 1) {
                const nextId = chapterKeys[idx + 1];
                if (!chapterCache[nextId] && storyData[nextId].contentUrl) {
                    const bypassCacheUrl = storyData[nextId].contentUrl + '?v=' + new Date().getTime();
                    fetch(bypassCacheUrl, { cache: 'no-store' }).then(r => r.ok ? r.text() : null).then(text => { 
                        if (text) chapterCache[nextId] = cleanHTMLContent(text); 
                    }).catch(() => {});
                }
            }
        }

        async function showChapter(chapterId) {
            if (isAnimating) return;
            isAnimating = true;
            
            els.spinner.classList.add('visible'); 
            els.errorMessage.classList.remove('visible'); 
            els.contentDisplay.classList.add('fading-out');
            els.navButtons.classList.remove('is-visible');
            els.progressBar.style.width = '0%'; 
            
            if (contentObserver) contentObserver.disconnect();
            
            try {
                const content = await fetchChapter(chapterId);
                currentChapterId = chapterId;
                els.contentDisplay.innerHTML = content;
                els.contentDisplay.scrollTop = 0;
                
                // مدیریت کلاس فعال برای لینک‌های منو
                document.querySelectorAll('.chapter-link').forEach(link => {
                    link.classList.toggle('active', link.dataset.chapter === chapterId);
                });
                
                // باز نگه داشتن آرکی که چپتر فعال داخلش هست (اختیاری اما کاربرپسند)
                const activeLink = document.querySelector(`.chapter-link[data-chapter="${chapterId}"]`);
                if(activeLink) {
                    const parentArc = activeLink.closest('.arc-content');
                    if(parentArc && !parentArc.classList.contains('open')) {
                        parentArc.classList.add('open');
                        parentArc.previousElementSibling.querySelector('.arc-icon').classList.add('open');
                    }
                }
                
                const index = chapterKeys.indexOf(currentChapterId);
                els.prevChapter.disabled = (index === 0);
                els.nextChapter.disabled = (index === chapterKeys.length - 1);
                
                AudioManager.playForChapter(chapterId);
                preloadNextChapter();
                
                contentObserver = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting || entry.intersectionRatio > 0) {
                            entry.target.classList.add('is-visible');
                            obs.unobserve(entry.target);
                        }
                    });
                }, { root: els.contentDisplay, rootMargin: "150px", threshold: 0 });
                
                els.contentDisplay.querySelectorAll('.fade-in-up, .fade-in-right').forEach(el => contentObserver.observe(el));

                setTimeout(() => {
                    const hiddenElements = els.contentDisplay.querySelectorAll('.fade-in-up:not(.is-visible)');
                    hiddenElements.forEach(el => el.classList.add('is-visible'));
                }, 800);

                setTimeout(() => {
                    els.spinner.classList.remove('visible');
                    els.contentDisplay.classList.remove('fading-out');
                    els.navButtons.classList.add('is-visible');
                    isAnimating = false;
                }, 300);

            } catch (error) {
                els.spinner.classList.remove('visible');
                els.contentDisplay.innerHTML = ''; 
                els.errorMessage.classList.add('visible'); 
                isAnimating = false;
            }
        }

        function createChapterBtn(chapterId) {
            const link = document.createElement('button');
            link.className = 'chapter-link p-2 md:p-3 rounded-lg text-sm md:text-base outline-none mt-1';
            link.textContent = storyData[chapterId].title;
            link.dataset.chapter = chapterId;
            link.addEventListener('click', () => {
                if (chapterId !== currentChapterId && !isAnimating) {
                    showChapter(chapterId);
                    els.sidebar.classList.remove('open'); 
                    els.sidebarOverlay.classList.add('hidden');
                }
            });
            return link;
        }

        function buildSidebarMenu() {
            tocStructure.forEach(item => {
                if (!item.isArc) {
                    let btn = createChapterBtn(item.id);
                    els.toc.appendChild(btn);
                } else {
                    let arcWrapper = document.createElement('div');
                    arcWrapper.className = 'mb-1 mt-2';
                    
                    let arcBtn = document.createElement('button');
                    arcBtn.className = 'w-full flex justify-between items-center p-3 rounded-lg text-base md:text-lg font-bold outline-none text-ura-gold border border-transparent hover:border-[rgba(212,175,55,0.3)] hover:bg-[rgba(212,175,55,0.05)] transition';
                    arcBtn.innerHTML = `<span>${item.title}</span><svg class="arc-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>`;
                    
                    let arcContent = document.createElement('div');
                    arcContent.className = 'arc-content flex flex-col pl-2 border-r-2 border-[rgba(212,175,55,0.2)] mr-2 mt-1';
                    
                    item.chapters.forEach(chapId => {
                        let btn = createChapterBtn(chapId);
                        arcContent.appendChild(btn);
                    });
                    
                    arcBtn.addEventListener('click', () => {
                        arcContent.classList.toggle('open');
                        arcBtn.querySelector('.arc-icon').classList.toggle('open');
                    });
                    
                    // آرک‌ها به صورت پیش‌فرض باز باشند (یا می‌توانید بسته نگه دارید)
                    arcContent.classList.add('open');
                    arcBtn.querySelector('.arc-icon').classList.add('open');

                    arcWrapper.appendChild(arcBtn);
                    arcWrapper.appendChild(arcContent);
                    els.toc.appendChild(arcWrapper);
                }
            });
        }

        function bindEvents() {
            buildSidebarMenu();

            els.incFont.addEventListener('click', () => { if(fontSize < 30) { fontSize += 2; applyFontSize(); } });
            els.decFont.addEventListener('click', () => { if(fontSize > 12) { fontSize -= 2; applyFontSize(); } });
            
            els.audioBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                els.audioBtn.textContent = isMuted ? 'پخش صدا' : 'بی‌صدا';
                if(isMuted) els.audioBtn.classList.remove('text-ura-gold');
                else els.audioBtn.classList.add('text-ura-gold');
                AudioManager.playForChapter(currentChapterId);
            });

            els.prevChapter.addEventListener('click', () => { 
                if(!isAnimating && chapterKeys.indexOf(currentChapterId) > 0) 
                    showChapter(chapterKeys[chapterKeys.indexOf(currentChapterId)-1]); 
            });
            els.nextChapter.addEventListener('click', () => { 
                if(!isAnimating && chapterKeys.indexOf(currentChapterId) < chapterKeys.length-1) 
                    showChapter(chapterKeys[chapterKeys.indexOf(currentChapterId)+1]); 
            });
            
            els.menuToggle.addEventListener('click', () => {
                els.sidebar.classList.toggle('open');
                els.sidebarOverlay.classList.toggle('hidden');
            });
            els.sidebarOverlay.addEventListener('click', () => {
                els.sidebar.classList.remove('open');
                els.sidebarOverlay.classList.add('hidden');
            });
            
            els.contentDisplay.addEventListener('scroll', () => {
                const scrollableHeight = els.contentDisplay.scrollHeight - els.contentDisplay.clientHeight;
                if (scrollableHeight > 0) els.progressBar.style.width = `${(els.contentDisplay.scrollTop / scrollableHeight) * 100}%`;
            });
            
            els.retryBtn.addEventListener('click', () => showChapter(currentChapterId));

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' && !els.nextChapter.disabled) els.nextChapter.click();
                if (e.key === 'ArrowLeft' && !els.prevChapter.disabled) els.prevChapter.click();
                if (e.key === 'm' || e.key === 'M') els.audioBtn.click();
            });
        }

        bindEvents();
        // شروع برنامه
        showChapter(currentChapterId);
    </script>
</body>
</html>
